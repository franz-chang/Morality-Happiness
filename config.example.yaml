# Morality Happiness project configuration template.
# Copy to config.yaml and replace the placeholder API values with your real keys.

server:
  host: "127.0.0.1"
  port: 38471

simulation:
  population_size: 120
  ticks: 560
  replications: 10
  seed: 42
  need_base: 1.5
  food_scale: 1.6
  alpha: 1.15
  alpha_individual: 1.35
  lambda_c: 0.2
  lambda_g: 0.25
  org_cost_per_team: 0.75
  group_cost_per_team: 0.45
  base_combat_power: 10.0
  prey_meat_scale: 0.18
  scarcity_resource_multiplier: 1.21094 # S3 baseline calibration, 560 ticks, seed 42
  abundance_resource_multiplier: 0.92285 # S6 baseline calibration, 560 ticks, seed 42
  environment_volatility: 0.1
  organized_equal_weight: 0.8
  share_norm_alt_weight: 0.4
  share_norm_restraint_weight: 0.2
  restraint_need_discount: 0.12
  reserve_cap_days: 7.0
  typical_team_size: 10
  target_group_size: 8
  min_group_size: 3
  max_group_size: 12
  regroup_interval: 20
  individual_transfer_strength: 0.18
  group_need_memory_weight: 0.3
  relationship_memory_weight: 0.15
  moral_consistency_weight: 0.2
  autonomy_weight: 0.1
  enable_participation_choice: true
  moral_adaptation_rate: 0.01
  trade_enabled: true
  rank_enabled: true
  rank_split_enabled: true
  promotion_enabled: true
  initial_shells: 30.0 # Used only by the equal-shells robustness control.
  initial_shells_distribution: "uniform"
  initial_shells_min: 20.0
  initial_shells_max: 40.0
  burn_in_ticks: 28
  relief_source: "external"
  public_food_reserve: 0.0
  reference_meals_per_agent: 8.0
  shell_base_price: 1.0
  shell_min_price: 0.2
  shell_max_price: 5.0
  market_price_rule: "demand_supply"
  buyer_budget_fraction: 0.5
  trade_safety_buffer: 1.5
  max_trade_rounds: 1
  idio_sigma: 0.3
  chief_share_weight: 4.0
  chieftain_share_weight: 2.0
  hunter_share_weight: 1.0
  chief_leadership_share: 0.0307692308 # 4 / (4 + 7*2 + 112*1)
  chieftain_slots: 7
  hunters_per_chieftain: 16
  promotion_period: 28
  promotion_shell_weight: 0.80
  promotion_hunting_weight: 0.20
  strict_redistribution: true
  min_tenure_periods: 0

llm:
  default_provider: "rule"
  sample_rate: 0.0
  temperature: 0.2
  timeout_seconds: 60
  max_tokens: 256
  decision_retries: 2
  providers:
    rule:
      label: "规则默认"
      model: "deterministic-wellbeing-engine"
      api_key: ""
      base_url: ""
      description: "不调用外部 API，使用本地可复现实验规则。"
    openai:
      label: "NO.1 API（OpenAI兼容）"
      model: "gpt-4o"
      api_key: "这里是API"
      base_url: "https://api.rcouyi.com/v1"
      response_mode: "instruct"
      description: "NO.1 API OpenAI 兼容接口；API Key 请填写该站控制台的令牌。Base URL 按官方聊天接口文档设置。"
    deepseek:
      label: "DeepSeek-V4.1-Flash-1017"
      model: "deepseek-flash"
      api_key: "这里是API"
      base_url: "https://api.deepseek.com/v1"
      description: "界面名称 DeepSeek-V4.1-Flash-1017；API 调用 ID 为 deepseek-flash。OpenAI-Compatible direct-json，不经过 Camel-AI。"
    local-deepseek:
      label: "本地DeepSeek"
      model: "deepseek-v4-flash"
      api_key: "这里是API"
      base_url: "https://uni-api.cstcloud.cn/v1"
      fallback_base_urls:
        - "https://uni-api-global.cstcloud.cn/v1"
      response_mode: "instruct"
      timeout_seconds: 45
      route_timeout_seconds: 20
      max_retries: 0
      decision_retries: 1
      max_tokens: 96
      thinking: false
      chat_template_kwargs:
        thinking: false
      description: "中国科技云 Uni-API OpenAI-Compatible direct-json 接口，优先国内入口并自动备用 Global；默认关闭 thinking，按 instruct/直接回答模式输出。"
    qwen3:
      label: "Qwen3 (Ollama)"
      model: "qwen3:2b"
      api_key: "EMPTY"
      base_url: "http://localhost:11434"
      description: "Ollama 原生 /api/chat 接口；可改为远程服务器地址，例如 http://your-server:11434。"
    qwen-bailian:
      label: "阿里云Qwen"
      model: "qwen-plus"
      api_key: "这里是API"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      response_mode: "instruct"
      max_tokens: 256
      description: "阿里云百炼 OpenAI-Compatible Chat Completions 接口；可将 model 改为百炼控制台中的 Qwen 模型 ID。"
