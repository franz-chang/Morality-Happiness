[project]
name = "morality-happiness"
version = "0.1.0"
description = "Multi-agent hunting, morality, and wellbeing simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "camel-ai>=0.2.0",
    "openai>=1.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
llm = ["camel-ai>=0.2.0", "openai>=1.0.0", "PyYAML>=6.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
morality-happiness = "morality_happiness.cli:main"
morality-happiness-server = "morality_happiness.server:main"

[tool.setuptools.packages.find]
include = ["morality_happiness*"]
exclude = ["frontend*", "outputs*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
